name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      # Never checks out PR code, so pull_request_target's write token is not exposed to it.
      - if: github.event_name == 'pull_request_target' || github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        # ponytail: upstream repo is archived; pinned to the v2.6.1 commit, fork it if it ever breaks
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/Ideolyst/relay/blob/main/CLA.md
          path-to-signatures: signatures/version1/cla.json
          # main is protected, so signatures live on their own unprotected branch
          branch: cla-signatures
          allowlist: RudreshNarwal,dependabot[bot],github-actions[bot]
